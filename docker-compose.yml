version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: backend:2.0
    container_name: backend_app
    restart: always
    networks:
      - devops-network
    volumes:
      - ./backend/data.txt:/app/data.txt

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend:2.0
    container_name: frontend_app
    restart: always
    depends_on:
      - backend
    networks:
      - devops-network
    ports:
      - "80:80"

networks:
  devops-network:
    driver: bridge